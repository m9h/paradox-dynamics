[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "paradox-dynamics"
version = "0.1.0"
description = "Executable experiments in truth-value revision, dynamics, and numerical precision"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Morgan Hough"}]
dependencies = ["numpy>=2,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8", "ipywidgets>=8,<9"]

[project.scripts]
paradox = "paradox_dynamics.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
